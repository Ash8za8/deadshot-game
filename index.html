<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DEADSHOT ARENA 3D FPS - P2P Multiplayer</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- PeerJS for WebRTC -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: #09090b;
      color: #f4f4f5;
    }
    #game-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .crosshair-line {
      position: absolute;
      background-color: rgba(255, 255, 255, 0.85);
      box-shadow: 0 0 4px rgba(0,0,0,0.8);
    }
    .hitmarker-line {
      position: absolute;
      background-color: #ef4444;
      width: 12px;
      height: 2px;
      transform-origin: center;
    }
    .sniper-scope {
      background: radial-gradient(circle at center, transparent 30%, black 35%, black 100%);
    }
    ::-webkit-scrollbar {
      width: 4px;
    }
    ::-webkit-scrollbar-thumb {
      background: #3f3f46;
      border-radius: 4px;
    }
  </style>
</head>
<body class="relative w-full h-full">

  <!-- GAME CANVAS CONTAINER -->
  <div id="canvas-container" class="absolute inset-0 w-full h-full">
    <canvas id="game-canvas"></canvas>
  </div>

  <!-- CROSSHAIR -->
  <div id="crosshair" class="absolute inset-0 pointer-events-none flex items-center justify-center z-10 hidden">
    <div id="crosshair-dot" class="w-1.5 h-1.5 bg-white rounded-full shadow-[0_0_4px_rgba(0,0,0,0.8)]"></div>
  </div>

  <!-- HUD TOP BAR -->
  <div id="hud-top" class="absolute top-4 left-1/2 -translate-x-1/2 pointer-events-none flex items-center gap-6 z-10 hidden">
    <div class="bg-zinc-900/80 backdrop-blur border border-zinc-800 px-6 py-2 rounded-xl flex items-center gap-6 shadow-xl">
      <div class="flex items-center gap-2">
        <span class="text-xs uppercase tracking-wider text-blue-400 font-bold">Blue</span>
        <span id="hud-blue-score" class="text-xl font-black text-white">0</span>
      </div>
      <div class="text-zinc-600 font-bold">VS</div>
      <div class="flex items-center gap-2">
        <span id="hud-red-score" class="text-xl font-black text-white">0</span>
        <span class="text-xs uppercase tracking-wider text-red-400 font-bold">Red</span>
      </div>
    </div>
    <div class="bg-zinc-900/80 backdrop-blur border border-zinc-800 px-4 py-2 rounded-xl text-zinc-300 font-mono font-bold shadow-xl">
      <span id="hud-timer">10:00</span>
    </div>
  </div>

  <!-- HUD BOTTOM BAR -->
  <div id="hud-bottom" class="absolute bottom-6 left-6 right-6 pointer-events-none flex justify-between items-end z-10 hidden">
    <div class="bg-zinc-900/80 backdrop-blur border border-zinc-800 p-4 rounded-2xl flex items-center gap-4 shadow-xl min-w-[180px]">
      <div class="text-red-500 text-2xl"><i class="fa-solid fa-heart-pulse"></i></div>
      <div>
        <div class="text-xs uppercase tracking-wider text-zinc-400 font-semibold">Health</div>
        <div id="hud-hp" class="text-3xl font-black text-white tracking-tight">100</div>
      </div>
    </div>
    <div class="bg-zinc-900/80 backdrop-blur border border-zinc-800 p-4 rounded-2xl flex items-center gap-6 shadow-xl min-w-[200px] justify-between">
      <div>
        <div id="hud-weapon-name" class="text-xs uppercase tracking-wider text-blue-400 font-semibold">Assault Rifle</div>
        <div class="text-3xl font-black text-white tracking-tight flex items-baseline gap-1">
          <span id="hud-ammo">30</span>
          <span class="text-sm text-zinc-500 font-medium">/ <span id="hud-reserve">90</span></span>
        </div>
      </div>
      <div class="text-blue-400 text-2xl"><i class="fa-solid fa-gun"></i></div>
    </div>
  </div>

  <!-- MAIN MENU OVERLAY -->
  <div id="menu-screen" class="absolute inset-0 bg-zinc-950/90 backdrop-blur-md flex items-center justify-center z-50">
    <div class="bg-zinc-900 border border-zinc-800 p-8 rounded-3xl w-full max-w-md shadow-2xl flex flex-col gap-6">
      <div>
        <h1 class="text-3xl font-black tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-indigo-500">DEADSHOT ARENA</h1>
        <p class="text-xs text-zinc-400 mt-1">Multiplayer 3D Tactical FPS</p>
      </div>

      <div class="flex flex-col gap-4">
        <div>
          <label class="text-xs font-semibold text-zinc-400 uppercase tracking-wider">Player Name</label>
          <input id="input-name" type="text" value="Player" maxlength="15" class="w-full mt-1.5 bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-500 transition-colors">
        </div>

        <div>
          <label class="text-xs font-semibold text-zinc-400 uppercase tracking-wider">Team</label>
          <div class="grid grid-cols-2 gap-3 mt-1.5">
            <button id="btn-team-blue" onclick="setTeam('blue')" class="py-3 rounded-xl border border-blue-500 bg-blue-500/10 text-blue-400 font-bold transition-all">Blue Team</button>
            <button id="btn-team-red" onclick="setTeam('red')" class="py-3 rounded-xl border border-zinc-800 bg-zinc-950 text-zinc-400 font-bold transition-all">Red Team</button>
          </div>
        </div>
      </div>

      <div class="flex flex-col gap-3 mt-2">
        <button id="btn-host" onclick="hostGame()" class="w-full py-4 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-xl shadow-lg shadow-blue-600/30 transition-all flex items-center justify-center gap-2 cursor-pointer">
          <i class="fa-solid fa-server"></i> Create Lobby (Host)
        </button>
        <div class="flex gap-2">
          <input id="input-room-code" type="text" placeholder="Enter Room Code" class="flex-1 bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-3 text-white uppercase focus:outline-none focus:border-blue-500 transition-colors">
          <button onclick="joinGame()" class="px-6 bg-zinc-800 hover:bg-zinc-700 text-white font-bold rounded-xl transition-all cursor-pointer">Join</button>
        </div>
      </div>
    </div>
  </div>

  <!-- LOBBY SCREEN -->
  <div id="lobby-screen" class="absolute inset-0 bg-zinc-950/90 backdrop-blur-md hidden items-center justify-center z-50">
    <div class="bg-zinc-900 border border-zinc-800 p-8 rounded-3xl w-full max-w-lg shadow-2xl flex flex-col gap-6">
      <div class="flex justify-between items-center">
        <div>
          <h2 class="text-2xl font-black text-white">Lobby</h2>
          <p class="text-xs text-zinc-400 mt-1">Share room code with friends to play together</p>
        </div>
        <div class="bg-zinc-950 border border-zinc-800 px-4 py-2 rounded-xl">
          <span class="text-xs text-zinc-500 uppercase block">Room Code</span>
          <span id="display-room-code" class="text-lg font-mono font-bold text-blue-400">----</span>
        </div>
      </div>

      <div class="flex flex-col gap-2">
        <span class="text-xs font-semibold text-zinc-400 uppercase tracking-wider">Connected Players</span>
        <div id="player-list" class="bg-zinc-950 border border-zinc-800 rounded-xl p-4 h-48 overflow-y-auto flex flex-col gap-2"></div>
      </div>

      <button id="btn-start-game" onclick="startGame()" class="w-full py-4 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl shadow-lg shadow-emerald-600/30 transition-all hidden cursor-pointer">
        Start Match
      </button>
      <div id="waiting-host-text" class="text-center text-sm text-zinc-500">Waiting for host to start the match...</div>
    </div>
  </div>

  <!-- SCRIPT -->
  <script>
    let selectedTeam = 'blue';
    function setTeam(team) {
      selectedTeam = team;
      if(team === 'blue') {
        document.getElementById('btn-team-blue').className = "py-3 rounded-xl border border-blue-500 bg-blue-500/10 text-blue-400 font-bold transition-all";
        document.getElementById('btn-team-red').className = "py-3 rounded-xl border border-zinc-800 bg-zinc-950 text-zinc-400 font-bold transition-all";
      } else {
        document.getElementById('btn-team-red').className = "py-3 rounded-xl border border-red-500 bg-red-500/10 text-red-400 font-bold transition-all";
        document.getElementById('btn-team-blue').className = "py-3 rounded-xl border border-zinc-800 bg-zinc-950 text-zinc-400 font-bold transition-all";
      }
    }

    let peer = null;
    let conn = null;
    let connections = [];
    let isHost = false;
    let roomId = '';
    let players = {};
    let myId = '';

    function hostGame() {
      const btn = document.getElementById('btn-host');
      btn.innerText = "Connecting to Relay...";
      const name = document.getElementById('input-name').value || 'Player';
      roomId = Math.random().toString(36).substring(2, 8).toUpperCase();
      
      peer = new Peer('ds-' + roomId);
      
      peer.on('open', (id) => {
        myId = peer.id;
        isHost = true;
        players[myId] = { name, team: selectedTeam, hp: 100, score: 0 };
        showLobby();
      });

      peer.on('error', (err) => {
        console.error(err);
        btn.innerHTML = '<i class="fa-solid fa-server"></i> Create Lobby (Host)';
        alert('Connection error: ' + err.type + '. Try clicking again.');
      });

      peer.on('connection', (c) => {
        connections.push(c);
        setupConnection(c);
      });
    }

    function joinGame() {
      const code = document.getElementById('input-room-code').value.trim().toUpperCase();
      if(!code) return alert('Enter room code!');
      const name = document.getElementById('input-name').value || 'Player';
      
      peer = new Peer();
      peer.on('open', (id) => {
        myId = peer.id;
        conn = peer.connect('ds-' + code);
        setupConnection(conn);
      });

      peer.on('error', (err) => {
        console.error(err);
        alert('Failed to join room: ' + err.type);
      });
    }

    function setupConnection(c) {
      c.on('open', () => {
        if(!isHost) {
          showLobby();
          c.send({ type: 'JOIN', name: document.getElementById('input-name').value, team: selectedTeam });
        }
      });

      c.on('data', (data) => {
        if(isHost) {
          if(data.type === 'JOIN') {
            players[c.peer] = { name: data.name, team: data.team, hp: 100, score: 0 };
            broadcast({ type: 'SYNC_PLAYERS', players });
            updateLobbyUI();
          }
        } else {
          if(data.type === 'SYNC_PLAYERS') {
            players = data.players;
            updateLobbyUI();
          } else if(data.type === 'START_GAME') {
            startGameUI();
          }
        }
      });
    }

    function broadcast(data) {
      connections.forEach(c => c.send(data));
    }

    function showLobby() {
      document.getElementById('menu-screen').classList.add('hidden');
      document.getElementById('lobby-screen').classList.remove('hidden');
      document.getElementById('lobby-screen').classList.add('flex');
      document.getElementById('display-room-code').innerText = roomId || document.getElementById('input-room-code').value;
      if(isHost) {
        document.getElementById('btn-start-game').classList.remove('hidden');
        document.getElementById('waiting-host-text').classList.add('hidden');
      }
      updateLobbyUI();
    }

    function updateLobbyUI() {
      const list = document.getElementById('player-list');
      list.innerHTML = '';
      Object.keys(players).forEach(id => {
        const p = players[id];
        list.innerHTML += `<div class="flex justify-between items-center bg-zinc-900 p-3 rounded-xl border border-zinc-800"><span class="font-bold text-white">${p.name}</span><span class="text-xs px-2.5 py-1 rounded-lg ${p.team === 'blue' ? 'bg-blue-500/20 text-blue-400' : 'bg-red-500/20 text-red-400'} uppercase font-bold">${p.team}</span></div>`;
      });
    }

    function startGame() {
      broadcast({ type: 'START_GAME' });
      startGameUI();
    }

    function startGameUI() {
      document.getElementById('lobby-screen').classList.remove('flex');
      document.getElementById('lobby-screen').classList.add('hidden');
      document.getElementById('crosshair').classList.remove('hidden');
      document.getElementById('hud-top').classList.remove('hidden');
      document.getElementById('hud-bottom').classList.remove('hidden');
      initThreeJS();
    }

    function initThreeJS() {
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x09090b);
      scene.fog = new THREE.FogExp2(0x09090b, 0.015);

      const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('game-canvas'), antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);

      const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
      scene.add(ambientLight);
      const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
      dirLight.position.set(20, 40, 20);
      scene.add(dirLight);

      const floorGeo = new THREE.PlaneGeometry(100, 100);
      const floorMat = new THREE.MeshStandardMaterial({ color: 0x18181b, roughness: 0.8 });
      const floor = new THREE.Mesh(floorGeo, floorMat);
      floor.rotation.x = -Math.PI / 2;
      scene.add(floor);

      const boxGeo = new THREE.BoxGeometry(4, 4, 4);
      const boxMat = new THREE.MeshStandardMaterial({ color: 0x27272a });
      for(let i = 0; i < 15; i++) {
        const box = new THREE.Mesh(boxGeo, boxMat);
        box.position.set((Math.random() - 0.5) * 60, 2, (Math.random() - 0.5) * 60);
        scene.add(box);
      }

      camera.position.set(0, 1.6, 5);

      const canvas = document.getElementById('game-canvas');
      canvas.addEventListener('click', () => {
        canvas.requestPointerLock();
      });

      let yaw = 0;
      let pitch = 0;
      document.addEventListener('mousemove', (e) => {
        if(document.pointerLockElement !== canvas) return;
        const sensitivity = 0.002;
        yaw -= e.movementX * sensitivity;
        pitch -= e.movementY * sensitivity;
        pitch = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, pitch));
        
        camera.rotation.order = 'YXZ';
        camera.rotation.y = yaw;
        camera.rotation.x = pitch;
      });

      function animate() {
        requestAnimationFrame(animate);
        renderer.render(scene, camera);
      }
      animate();

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    }
  </script>
</body>
</html>
